table:
  schema: public
  name: notifications
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
# Inserted only by the backend's notify step handler (admin secret). The
# event trigger below is what actually delivers the email to the org owner -
# the `notify` workflow step type is implemented as a Hasura Event Trigger,
# per the tech stack requirement, instead of sending inline.
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_id
        - step_run_id
        - channel
        - payload
        - status
        - error
        - created_at
        - sent_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
event_triggers:
  - name: notify_on_insert
    definition:
      enable_manual: false
      insert:
        columns: "*"
    retry_conf:
      num_retries: 3
      interval_sec: 10
      timeout_sec: 30
    webhook: "https://backend-production-2490.up.railway.app/events/notify"
    headers:
      - name: X-Hasura-Event-Secret
        value: eac4eb5c98a4614133703ab097ebe7ae581abf4599c0de6f
