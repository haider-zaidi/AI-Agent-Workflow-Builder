table:
  schema: public
  name: organizations
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          schema: public
          name: org_members
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          schema: public
          name: workflows
object_relationships:
  - name: usage
    using:
      manual_configuration:
        remote_table:
          schema: public
          name: organization_usage
        column_mapping:
          id: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - quota_allowed
        - quota_used
        - created_at
        - updated_at
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
