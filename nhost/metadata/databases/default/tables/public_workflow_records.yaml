table:
  schema: public
  name: workflow_records
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
# Written only by the backend's db_write step handler (admin secret).
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_id
        - workflow_run_id
        - step_run_id
        - data
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
